name: uptime

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime-log
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe production
        id: probe
        continue-on-error: true
        env:
          BASE_URL: https://rapidapi-roan.vercel.app
        run: node scripts/probe.mjs
      - name: Commit log row (pass or fail)
        run: |
          git config user.name "dev55acc-ai"
          git config user.email "dev55acc-ai@users.noreply.github.com"
          git add uptime/log.jsonl
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "uptime probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
